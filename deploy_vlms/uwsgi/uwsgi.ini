; Flask 앱(index:application)을 uWSGI 로 띄우는 설정.
;
; 이 파일이 저장소에 있는 이유: GPU 서버에 systemd 권한이 없어 손댈 수 있는 것이
; uwsgi.ini 하나뿐이다. 그 하나가 저장소 밖에만 있으면 배포를 아무도 재현할 수 없다.
;
; 값 채우는 곳은 아래 [SET_ME] 표시 세 군데뿐이다. 나머지 숫자는 이 호스트의 제약
; (RAM 16GB · swap 없음 · vLLM 3인스턴스 상주)에서 나온 것이라 근거 없이 올리지 말 것.

[uwsgi]
; ── 앱 로드 ──────────────────────────────────────────────────────────────
; index.py 의 `application` = web_main 의 app. 이름이 `application` 인 것은 WSGI 관례고
; uWSGI 가 그 이름을 찾는다 (docs/study/01-nginx-uwsgi-flask.md 참고).
module = index:application
chdir = /path/to/llm_serving          ; [SET_ME] index.py 가 있는 디렉토리
virtualenv = /path/to/llm_serving/.venv   ; [SET_ME] venv 를 안 쓰면 이 줄을 지운다

; 앱 import 가 실패하면 **기동을 실패시킨다.** 기본값은 빈 워커로 그냥 떠서
; 모든 요청에 500 을 주는데, 그러면 "왜 500 이지"를 로그 뒤져 찾게 된다.
; 환경변수 하나가 빠졌을 때 그 사실이 즉시 드러나야 한다.
need-app = true

; ── nginx 와 붙는 자리 ───────────────────────────────────────────────────
; nginx/model_upload.conf 가 `proxy_pass http://127.0.0.1:5000` 이므로 HTTP 로 듣는다.
; nginx 를 `uwsgi_pass unix:/run/uwsgi/app.sock` 으로 쓰는 배치라면 아래 두 줄을
; 맞바꾼다. 프로토콜이 다르므로 **한쪽만 바꾸면 502 가 난다.**
http-socket = 127.0.0.1:5000
; socket = /run/uwsgi/app.sock
; chmod-socket = 660

; ── 동시성 ───────────────────────────────────────────────────────────────
; 워커 하나하나가 파이썬 인터프리터 한 벌이다. 이 호스트는 RAM 16GB 에 swap 이 없고
; vLLM 3인스턴스가 이미 상주하므로 processes 를 늘리는 것이 가장 비싼 선택이다.
;
; 그런데 이 앱의 일은 거의 전부 **대기**다 - vLLM 의 응답을 requests 로 기다리는 것.
; CPU 를 쓰지 않는 대기는 GIL 을 놓으므로 스레드로 받는 것이 맞다. 그래서
; processes 는 낮게, threads 를 높게 잡는다. 동시 처리 = 2 x 8 = 16.
;
; processes 를 2 로 둔 이유는 따로 있다: model_upload 의 /complete 는 업로드된 파일
; 전체를 다시 읽어 sha256 을 검증한다. 그건 CPU 작업이라 GIL 을 잡고 같은 워커의
; 다른 스레드를 멈춘다. 워커가 둘이면 그 동안에도 다른 하나가 프록시 요청을 받는다.
processes = 2
threads = 8
enable-threads = true
master = true
single-interpreter = true

; lazy-apps 는 켜지 않는다. 기본(prefork)은 master 에서 한 번 import 한 뒤 fork 하므로
; 파이썬 런타임과 임포트된 모듈이 copy-on-write 로 공유된다. RAM 이 빠듯한 호스트에서
; 그 절약이 크다. lazy-apps=true 는 워커마다 통째로 다시 import 한다.

; ── 타임아웃 ─────────────────────────────────────────────────────────────
; 바깥일수록 길어야 안쪽이 먼저 끊고 제대로 된 오류를 만든다:
;   nginx proxy_read_timeout 900s  >  harakiri 870  >  앱 자신의 requests timeout
;
; 870 은 가장 긴 정상 요청에 맞춘 값이다 - /api/model_upload/.../complete 의 전체
; 재해싱(5GB 샤드면 수십 초, 느린 스토리지면 그 이상). 프록시 쪽은
; VLM_SERVE_READ_TIMEOUT_SEC(기본 300)이 먼저 끊으므로 여기에 걸리지 않는다.
; 이 값을 앱 타임아웃보다 짧게 두면 워커가 요청 중간에 죽어 502 만 남는다.
harakiri = 870
harakiri-verbose = true

; ── 메모리 방어 ──────────────────────────────────────────────────────────
; swap 이 없으므로 워커가 부풀면 OOM killer 가 vLLM 을 먼저 죽일 수도 있다.
;
; **적용 대상은 이 uWSGI 워커(Flask)뿐이다.** vLLM 은 serve_vlm.py 가 os.execvpe 로
; 자기를 대체해 띄우는 별개 프로세스라 이 숫자와 무관하다. 그리고 이건 예약이 아니라
; 회수 트리거다 - 600 으로 둔다고 600MB 를 잡아 두지 않는다.
;
; 그래서 start_all.py 로 모델을 올리는 동안에는 이 상한이 닿지도 않는다(서빙 트래픽이
; 없어 워커는 100-150MB 에 머문다). 기동 중 Flask 몫을 진짜로 줄여야 한다면 레버는
; 이 값이 아니라 processes 다. 판단은 check_host_ram.py 로 웜 상태를 재고 나서.
;
; max-requests 는 처리한 요청 **횟수**, reload-on-rss 는 **메가바이트**다 (uWSGI 문서:
; "reload if rss memory is higher than specified megabytes"). 단위가 다르니 헷갈리지 말 것.
;
; 600MB 인 이유: 기동 직후 워커는 100-150MB 정도인데, 이미지 요청이 그 위에 얹힌다.
; 오프라인이라 이미지를 base64 data URL 로 본문에 싣고 request.get_data(cache=True) 가
; 그걸 통째로 들고 있는다 - 1080p 두 장이면 요청당 10MB 안팎이고 스레드가 8개다.
; 게다가 파이썬은 놓은 메모리를 OS 에 잘 안 돌려줘서 RSS 는 최고점 근처에 머문다.
; 그래서 상한을 최고점보다 넉넉히 잡지 않으면 워커가 쉴 새 없이 재활용된다.
; 2 워커 x 600MB = 1.2GB 로, 이 호스트의 웜 여유(약 4GB) 안에 들어간다.
max-requests = 500
reload-on-rss = 600

; 위 둘은 워커를 **graceful** 하게 재활용한다 - 처리 중인 요청을 기다린다. 다만 그
; 대기에는 mercy 시한이 있고 기본값이 60초라, 업로드 재해싱처럼 긴 요청이 그 사이에
; 걸리면 결국 잘린다. harakiri(870)가 이미 "정상 요청의 상한"이므로 여기도 맞춰 둔다.
; 이 줄이 없으면 메모리 재활용이 하필 가장 비싼 요청을 죽이는 일이 생긴다.
worker-reload-mercy = 900

; post-buffering 은 켜지 않는다(기본 off). model_upload 는 request.stream 을 직접
; 읽어 청크를 디스크로 흘리는데, 켜면 uWSGI 가 본문 전체를 먼저 받아 버려서
; 32MB 청크가 통째로 메모리/임시파일을 거친다. nginx 쪽 proxy_request_buffering off
; 와 짝을 이루는 설정이다.
buffer-size = 32768

; ── 환경변수 ─────────────────────────────────────────────────────────────
; **Flask 프로세스가 값을 얻는 유일한 통로다.** 이 앱은 셸 export 없이 뜨고,
; deploy_vlms/config/common.env 는 런처만 읽는다.
;
; VLM_SERVE_UPSTREAM_API_KEY 는 vLLM 의 --api-key(common.env 의 API_KEY)와 **같은 값**
; 이어야 한다. 프록시가 호출자의 Authorization 을 지우고 이 값을 주입하므로,
; 호출하는 쪽(workflow_3, 대시보드)은 이 키를 몰라도 된다.
; 이 줄이 없으면 vLLM 이 401 을 주고 /api/health 의 모든 모델이 unreachable 로 뜬다.
env = VLM_SERVE_UPSTREAM_API_KEY=SET_ME              ; [SET_ME]
; 업로드 목적지 루트. Flask 는 common.env 를 안 읽어서 ALLOWED_MODEL_ROOT 가 여기 못 온다.
env = MODEL_UPLOAD_ROOT=/path/to/models              ; [SET_ME]
; 업로드 인증 토큰. 비우면 인증 없이 열린다.
; env = MODEL_UPLOAD_TOKEN=
; 프록시 공용 토큰. 설정하면 /api/vlm_serve/<slug>/v1/* 에 요구된다 (home/health 는 열림).
; env = VLM_SERVE_TOKEN=
; vLLM 이 다른 장비에 있을 때만. 같은 서버면 기본값 127.0.0.1 로 충분하다.
; env = VLM_SERVE_UPSTREAM_HOST=127.0.0.1

; ── 로그 / 정리 ──────────────────────────────────────────────────────────
logto = /var/log/uwsgi/llm_serving.log   ; [SET_ME] 쓰기 권한이 있는 경로로
disable-logging = false                  ; 접근 로그를 끄지 않는다 - 401/502 를 여기서 본다
log-4xx = true
log-5xx = true
vacuum = true
die-on-term = true
