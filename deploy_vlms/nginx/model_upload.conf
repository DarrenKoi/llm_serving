# 모델 가중치 청크 업로드용 nginx location 블록.
#
# 기존 server { } 안에 넣거나 include 로 끌어 쓴다.
# proxy_pass 대상 포트는 Flask 앱이 실제로 듣는 곳으로 바꿀 것.
#
# 이 블록이 없으면(=nginx 기본값) 세 가지가 순서대로 터진다:
#   1) client_max_body_size 1m   -> 청크가 Flask 에 닿기도 전에 413
#   2) proxy_read_timeout 60s    -> /complete 의 전체 재해싱 중 504
#   3) proxy_request_buffering on -> 청크마다 임시파일에 통째로 받아썼다가 전달

location /api/model_upload/ {
    proxy_pass http://127.0.0.1:5000;

    # ── 0) 접근 제한 (선택) ────────────────────────────────────────────
    # 이 엔드포인트는 모델 루트 아래에 파일을 쓴다. 토큰(MODEL_UPLOAD_TOKEN)을
    # 안 걸 거라면, 대신 IP 로 좁히는 것이 한 줄로 끝난다.
    # allow 10.0.0.0/8;
    # deny  all;

    # ── 1) 청크 크기 상한 ──────────────────────────────────────────────
    # 클라이언트 MODEL_UPLOAD_CHUNK_MB(기본 32) 보다 넉넉히 크게.
    # 여기를 줄이면 클라이언트가 413 을 보고 스스로 청크를 반씩 줄이지만,
    # 왕복이 늘어날 뿐이므로 근본은 이 값을 올리는 것이다.
    client_max_body_size 128m;

    # ── 2) 타임아웃 ────────────────────────────────────────────────────
    # /complete 는 서버가 파일 전체를 다시 읽어 sha256 을 검증한다.
    # 5GB 샤드면 수 초~수십 초, 느린 스토리지면 그 이상이다.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 60s;
    # 느린 링크에서 바디가 끊겨 보이지 않도록.
    client_body_timeout 300s;

    # ── 3) 스트리밍 ────────────────────────────────────────────────────
    # 켜져 있으면(기본) nginx 가 청크 하나를 통째로 임시파일에 받은 뒤에야
    # Flask 로 넘긴다. 동작은 하지만 디스크 I/O 가 2배가 되고 지연이 는다.
    proxy_http_version 1.1;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
