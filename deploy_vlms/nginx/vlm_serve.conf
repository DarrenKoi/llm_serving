# /api/vlm_serve/* 프록시용 nginx location 블록.
#
# model_upload.conf 와 같은 자리(기존 server { } 안)에 넣는다. 이 블록이 **없으면**
# nginx 기본값 proxy_read_timeout 60s 가 걸린다. 그런데 qwen3.8-27b 는 thinking 이
# 기본 on 이고 effort 에 따라 몇 분씩 생각한다 - 60초는 정상 요청 한복판이다.
#
# 타임아웃은 바깥이 길어야 안쪽이 먼저 끊고 제대로 된 오류를 만든다:
#   nginx (여기)  >  uWSGI harakiri 870  >  앱의 VLM_SERVE_READ_TIMEOUT_SEC(기본 300)
# 이 순서가 뒤집히면 앱은 성공했는데 호출자는 504 를 보는 상황이 나온다.

location /api/vlm_serve/ {
    proxy_pass http://127.0.0.1:5000;

    # 사고 토큰이 지연의 대부분이다. 앱이 300s 에서 먼저 끊게 두고 nginx 는 그보다 길게.
    # 900s 는 harakiri(870)보다 길어야 해서 나온 값이다 - 600s 로 두면
    # VLM_SERVE_READ_TIMEOUT_SEC 를 올릴 수 있는 상한이 870 이 아니라 600 이 되어,
    # 위 주석이 경고하는 "앱은 성공했는데 호출자는 504" 가 실제로 난다.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_connect_timeout 60s;

    # 이미지 입력은 base64 data URL 로 본문에 실린다(오프라인이라 http URL 을 못 쓴다).
    # 1920x1080 PNG 두 장이면 수 MB 다. 기본 1m 은 모자란다.
    client_max_body_size 32m;

    # 스트리밍(stream=true)을 쓰는 클라이언트를 위해 버퍼링을 끈다. 켜져 있으면 nginx 가
    # 응답을 다 모은 뒤에야 흘려서 SSE 가 스트리밍처럼 보이지 않는다.
    # (Flask 프록시도 SSE 응답은 청크 단위로 흘리고 X-Accel-Buffering: no 를 붙인다 -
    #  scripts/README.md 의 "코딩 하네스 붙이기".)
    proxy_http_version 1.1;
    proxy_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
